<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas y Salidas - Taller Mecánico</title>
    <link rel="stylesheet" href="{% static 'mi_app/styles.css' %}">
</head>
<body>

    <div class="dashboard">
        <!-- Barra lateral de navegación -->
        <aside class="sidebar">
            <h2>⚙️ Taller<span>Panel</span></h2>
            <nav>
                <ul>
                    <li><a href="{% url 'inventario' %}">📦 Inventario</a></li>
                    <li><a href="{% url 'ingresar' %}" class="active">📑 Ingresar Repuesto</a></li>
                    <li><a href="{% url 'alertas' %}">⚠️ Alertas Stock</a></li>
                    <li><a href="{% url 'proveedores' %}">👥 Proveedores</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="main-header">
                <h1>Movimientos de Stock</h1>
            </header>

            <div class="inventory-container">
                <div class="form-section">
                    <h2>Ingresar Repuesto</h2>
                    <form action="{% url 'ingresar' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label for="codigo">Código de Barra / Ref</label>
                            <input type="text" id="codigo" name="codigo" required placeholder="Ej: #REF-005">
                        </div>

                        <div class="form-group">
                            <label for="nombre">Nombre del Repuesto</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Amortiguador trasero">
                        </div>

                        <div class="form-group">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria">
                                <option value="motor">Motor</option>
                                <option value="frenos">Frenos</option>
                                <option value="lubricantes">Lubricantes</option>
                                <option value="suspension">Suspensión</option>
                            </select>
                        </div>

                        <div class="form-group row">
                            <div>
                                <label for="cantidad">Cantidad</label>
                                <input type="number" id="cantidad" name="cantidad" min="1" required placeholder="10">
                            </div>
                            <div>
                                <label for="precio">Precio ($)</label>
                                <input type="number" id="precio" name="precio" min="0" required placeholder="15000">
                            </div>
                        </div>

                        <button type="submit" class="btn-add">Agregar al Inventario</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
